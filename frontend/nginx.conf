server {
    listen 80;
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # SSE 必需
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
